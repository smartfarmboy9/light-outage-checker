name: Update DTEK Addresses

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4

      - name: Update addresses
        run: python update_addresses.py

      - name: Check update result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          if Path("addresses_update_progress.json").exists():
              raise SystemExit("Оновлення не завершено")

          with open("addresses.json", encoding="utf-8") as f:
              data = json.load(f)

          if len(data) < 2000:
              raise SystemExit("Замало вулиць")

          print("Вулиць:", len(data))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addresses.json
          if ! git diff --cached --quiet; then
            git commit -m "Update DTEK addresses"
            git push
          fi
